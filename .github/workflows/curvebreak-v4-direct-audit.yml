name: Curvebreak v4 direct gameplay gate

on:
  push:
    branches:
      - pong-curvebreak-rebuild
    paths:
      - 'curvebreak/**'
      - '.github/workflows/curvebreak-v4-direct-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-gameplay-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 16

    steps:
      - name: Check out Curvebreak branch
        uses: actions/checkout@v4
        with:
          ref: pong-curvebreak-rebuild

      - name: Static gameplay contract
        run: |
          set -euo pipefail
          test -s curvebreak/v2/index.html
          test -s curvebreak/v2/patch.js
          test -s curvebreak/game.js
          test -s curvebreak/style.css
          test -s curvebreak/tests/gameplay-audit-v4.cjs
          grep -q 'curvebreak-v2.1' curvebreak/v2/index.html
          grep -q '__CURVEBREAK_PATCHED__' curvebreak/v2/patch.js
          grep -q 'spin did not bend the flight path' curvebreak/tests/gameplay-audit-v4.cjs
          grep -q 'Spike tip did not generate' curvebreak/tests/gameplay-audit-v4.cjs
          grep -q 'webkit-ipad' curvebreak/tests/gameplay-audit-v4.cjs
          node --check curvebreak/game.js
          node --check curvebreak/v2/patch.js
          node --check curvebreak/tests/gameplay-audit-v4.cjs

      - name: Install isolated browser harness
        run: |
          set -euo pipefail
          mkdir -p /tmp/curvebreak-harness
          cd /tmp/curvebreak-harness
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps webkit

      - name: Run direct gameplay matrix
        env:
          SYSTEM_CHROME: /usr/bin/google-chrome
          NODE_PATH: /tmp/curvebreak-harness/node_modules
        run: node curvebreak/tests/gameplay-audit-v4.cjs

      - name: Upload direct gameplay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curvebreak-v4-direct-evidence
          path: |
            curvebreak/evidence-v4
            /tmp/curvebreak-server.log
          if-no-files-found: ignore

name: Curvebreak v2 browser gauntlet

on:
  push:
    branches:
      - pong-curvebreak-rebuild
    paths:
      - 'curvebreak/**'
      - '.github/workflows/curvebreak-v2-browser-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-gauntlet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out Curvebreak branch
        uses: actions/checkout@v4
        with:
          ref: pong-curvebreak-rebuild

      - name: Static contract and syntax checks
        run: |
          set -euo pipefail
          test -s curvebreak/v2/index.html
          test -s curvebreak/v2/patch.js
          test -s curvebreak/game.js
          test -s curvebreak/style.css
          test -s curvebreak/tests/browser-audit.cjs
          test -s curvebreak/tests/run-v2-audit.cjs
          grep -q 'curvebreak-v2.1' curvebreak/v2/index.html
          grep -q '__CURVEBREAK_PATCHED__' curvebreak/v2/patch.js
          grep -q 'webkit-ipad' curvebreak/tests/browser-audit.cjs
          node --check curvebreak/game.js
          node --check curvebreak/v2/patch.js
          node --check curvebreak/tests/browser-audit.cjs
          node --check curvebreak/tests/run-v2-audit.cjs

      - name: Install isolated browser harness
        run: |
          set -euo pipefail
          mkdir -p /tmp/curvebreak-harness
          cd /tmp/curvebreak-harness
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps webkit

      - name: Run Chromium and WebKit gameplay matrix
        env:
          SYSTEM_CHROME: /usr/bin/google-chrome
          NODE_PATH: /tmp/curvebreak-harness/node_modules
        run: node curvebreak/tests/run-v2-audit.cjs

      - name: Upload Curvebreak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curvebreak-v2-browser-evidence
          path: |
            curvebreak/evidence
            /tmp/curvebreak-server.log
          if-no-files-found: ignore

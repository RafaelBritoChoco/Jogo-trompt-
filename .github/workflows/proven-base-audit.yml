name: Proven 3D Pong base gauntlet

on:
  push:
    branches:
      - pong-proven-base-r1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out isolated rebuild branch
        uses: actions/checkout@v4
        with:
          ref: pong-proven-base-r1
          fetch-depth: 0

      - name: Import pinned open-source game and apply readability layer
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_SHA="6ba8949d289f6045d115e0e2e9eeabe7927b14ee"
          rm -rf /tmp/PathTracedPong
          git clone --quiet https://github.com/erichlof/PathTracedPong.git /tmp/PathTracedPong
          git -C /tmp/PathTracedPong checkout --quiet "$UPSTREAM_SHA"

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/PathTracedPong/. .
          rm -rf .git/modules 2>/dev/null || true
          rm -rf .git
          mv Path_Traced_Pong.html index.html
          cp LICENSE LICENSE-UPSTREAM-PathTracedPong

          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          html = html.replace('<html lang="en">', '<html lang="pt-BR" data-build="proven-base-r1">')
          html = html.replace('<title>Path Traced Pong (a fully path traced game)</title>', '<title>PONG 3D — Proven Sports Base</title>')
          html = html.replace('<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">', '<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#171b20"><link rel="icon" href="data:,">')
          html = html.replace('<button id="startButton">Play</button>', '<button id="startButton"><span>JOGAR</span><small>base física comprovada</small></button>')
          html = html.replace('<div id="info">Path Traced Pong (a fully path traced game)</div>', '<div id="info">PONG 3D · PROTÓTIPO DE LEGIBILIDADE</div>')
          html = html.replace('color:rgb(26,179,255);', 'color:#2767a8;')
          html = html.replace('color:rgb(179,26,255);', 'color:#b4432f;')
          html = html.replace('<script defer src="js/Path_Traced_Pong.js"> </script>', '''<script defer src="js/Path_Traced_Pong.js"> </script>
          <div id="identityHud" aria-live="polite">
            <strong>VOCÊ</strong><span>raquete azul em primeiro plano</span>
            <i></i>
            <strong>RIVAL</strong><span>raquete vermelha ao fundo</span>
          </div>
          <div id="controlHelp">ARRASTE PARA MOVER · A BOLA BRANCA É O ÚNICO ALVO · PRIMEIRO A 5</div>''')
          html = html.replace('</head>', '''<style id="readability-layer">
          :root{--paper:#e8e1d4;--ink:#171b20;--blue:#2767a8;--rust:#b4432f;--line:rgba(23,27,32,.25)}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
          #container canvas{position:fixed!important;inset:0;width:100%!important;height:100%!important;touch-action:none}
          #overlay{position:fixed!important;inset:0!important;display:grid!important;place-items:center!important;background:linear-gradient(145deg,#ece4d6,#c9bcaa)!important;z-index:10000!important}
          #startButton{min-width:230px;padding:18px 28px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--ink);box-shadow:8px 8px 0 var(--ink);font:900 23px/1 system-ui;letter-spacing:.1em;cursor:pointer}
          #startButton small{display:block;margin-top:8px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;opacity:.65}
          #startButton:active{transform:translate(4px,4px);box-shadow:4px 4px 0 var(--ink)}
          #info{position:fixed!important;top:max(10px,env(safe-area-inset-top))!important;left:50%!important;transform:translateX(-50%);padding:8px 12px;background:rgba(232,225,212,.92);border:1px solid var(--ink);border-radius:4px;color:var(--ink)!important;font:850 10px/1 system-ui!important;letter-spacing:.14em!important;white-space:nowrap;z-index:20}
          #playerScore,#computerScore{bottom:max(12px,env(safe-area-inset-bottom))!important;padding:8px 11px;background:rgba(232,225,212,.92);border:1px solid currentColor;border-radius:4px;font:900 clamp(16px,3.2vw,28px)/1 system-ui!important;z-index:20}
          #cameraInfo{display:none!important}
          #infoBanner{top:13%!important;left:12%!important;right:12%!important;color:var(--paper)!important;font:900 clamp(22px,5vw,50px)/1 system-ui!important;text-shadow:0 2px 14px #000;z-index:20}
          #identityHud{position:fixed;left:50%;top:max(53px,calc(env(safe-area-inset-top) + 53px));transform:translateX(-50%);display:grid;grid-template-columns:auto auto 24px auto auto;gap:7px;align-items:center;padding:7px 10px;background:rgba(232,225,212,.9);border:1px solid var(--line);border-radius:4px;color:var(--ink);font-size:10px;z-index:18;pointer-events:none}
          #identityHud strong:first-child{color:var(--blue)}#identityHud strong:nth-of-type(2){color:var(--rust)}#identityHud i{height:1px;background:var(--line)}
          #controlHelp{position:fixed;left:50%;bottom:max(58px,calc(env(safe-area-inset-bottom) + 58px));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 24px);padding:7px 10px;background:rgba(23,27,32,.78);border-radius:4px;color:var(--paper);font:800 9px/1.25 system-ui;letter-spacing:.09em;text-align:center;z-index:18;pointer-events:none}
          .lil-gui.root{opacity:.18;transition:opacity .15s}.lil-gui.root:hover{opacity:1}
          @media(max-width:700px){#identityHud{grid-template-columns:auto auto;top:max(48px,calc(env(safe-area-inset-top) + 48px));font-size:9px}#identityHud i{display:none}#controlHelp{font-size:8px;bottom:max(54px,calc(env(safe-area-inset-bottom) + 54px))}.lil-gui.root{display:none!important}}
          </style></head>''')
          html_path.write_text(html, encoding='utf-8')

          game_path = Path('js/Path_Traced_Pong.js')
          game = game_path.read_text(encoding='utf-8')
          game = game.replace("let gravityOn = true;", "let gravityOn = false;")
          game = game.replace('playerScoreElement.innerHTML = "Player: " + playerScore;', 'playerScoreElement.innerHTML = "VOCÊ  " + playerScore;')
          game = game.replace('computerScoreElement.innerHTML = "Computer: " + computerScore;', 'computerScoreElement.innerHTML = "RIVAL  " + computerScore;')
          game = game.replace('infoBannerElement.innerHTML = "Player WINS!"', 'infoBannerElement.innerHTML = "VOCÊ VENCEU"')
          game = game.replace('infoBannerElement.innerHTML = "Computer WINS!"', 'infoBannerElement.innerHTML = "RIVAL VENCEU"')
          game += r'''

          // Test and audit bridge added by the Curvebreak rebuild.
          window.__PROVEN_PONG__ = {
            state: () => ({
              player: { x: playerPos.x, y: playerPos.y, z: playerPos.z },
              rival: { x: computerPos.x, y: computerPos.y, z: computerPos.z },
              ball: { x: ballPos.x, y: ballPos.y, z: ballPos.z, speed: ballSpeed },
              score: { player: playerScore, rival: computerScore },
              difficulty,
              gravityOn,
              newGameFlag,
              cutSceneIsPlaying
            }),
            setPlayer: (x, y) => {
              playerPos.x = Math.max(-halfRoomDimensions.x + paddleRadX, Math.min(halfRoomDimensions.x - paddleRadX, Number(x) || 0));
              playerPos.y = Math.max(-halfRoomDimensions.y + paddleRadY, Math.min(halfRoomDimensions.y - paddleRadY, Number(y) || 0));
            }
          };
          document.documentElement.dataset.gameBridge = 'ready';
          '''
          game_path.write_text(game, encoding='utf-8')

          Path('ATTRIBUTION.md').write_text('''# Attribution\n\nThis rebuild imports and modifies **PathTracedPong** by Erich Loftis, pinned to commit `6ba8949d289f6045d115e0e2e9eeabe7927b14ee`.\n\nThe upstream project is dedicated under CC0 1.0. Its complete license is preserved in `LICENSE-UPSTREAM-PathTracedPong`.\n\nThe first rebuild layer changes only naming, UI legibility, diagnostics and default gravity. Core rendering, camera, ball motion, collision, AI, touch and audio remain upstream-derived for the baseline audit.\n''', encoding='utf-8')
          PY

          git config user.name "Pong Proven-Base Auditor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "rebuild: import CC0 PathTracedPong baseline and remove AI-neon shell [skip ci]"
            git push origin HEAD:pong-proven-base-r1
          fi

      - name: Static integrity checks
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f js/Path_Traced_Pong.js
          test -f shaders/Path_Traced_Pong_Fragment.glsl
          test -f LICENSE-UPSTREAM-PathTracedPong
          grep -q 'data-build="proven-base-r1"' index.html
          grep -q '__PROVEN_PONG__' js/Path_Traced_Pong.js
          grep -q 'base física comprovada' index.html
          grep -q 'CC0' ATTRIBUTION.md
          test "$(wc -c < js/PathTracingCommon.js)" -gt 100000
          test "$(wc -c < js/three.module.min.js)" -gt 300000
          node --check js/Path_Traced_Pong.js

      - name: Install real browser harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps webkit

      - name: Run gameplay and legibility audit in Chrome and WebKit
        shell: bash
        env:
          SYSTEM_CHROME: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/proven-pong-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1

          cat > /tmp/proven-audit.cjs <<'NODE'
          const { chromium, webkit } = require('playwright');
          const fs = require('fs');
          const results = [];
          const BASE = 'http://127.0.0.1:8765/index.html';
          function assert(value, message) { if (!value) throw new Error(message); }
          const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y, a.z-b.z);

          async function runCase(browserType, engine, profile, launchOptions={}) {
            const browser = await browserType.launch({ headless:true, ...launchOptions });
            const context = await browser.newContext({
              viewport: profile.viewport,
              deviceScaleFactor: profile.touch ? 2 : 1,
              hasTouch: profile.touch,
              isMobile: profile.touch,
              userAgent: profile.userAgent
            });
            const page = await context.newPage();
            const errors=[]; const failed=[];
            page.on('pageerror', e => errors.push(`page:${e.message}`));
            page.on('console', m => { if(m.type()==='error') errors.push(`console:${m.text()}`); });
            page.on('requestfailed', r => failed.push(`${r.url()}::${r.failure()?.errorText}`));
            try {
              await page.goto(BASE,{waitUntil:'domcontentloaded',timeout:60000});
              await page.locator('#startButton').waitFor({state:'visible',timeout:20000});
              await page.screenshot({path:`evidence/${engine}-${profile.name}-menu.png`,fullPage:true});
              await page.locator('#startButton').click();
              await page.waitForFunction(() => document.documentElement.dataset.gameBridge==='ready' && window.__PROVEN_PONG__,null,{timeout:30000});
              await page.waitForTimeout(2200);
              const s0=await page.evaluate(()=>window.__PROVEN_PONG__.state());
              assert(Number.isFinite(s0.ball.z) && s0.ball.speed>0,`${engine}/${profile.name}: bola sem estado válido`);
              assert(s0.player.z>s0.rival.z,`${engine}/${profile.name}: câmera/jogador não estão no lado esperado`);

              const canvas=page.locator('#container canvas').first();
              await canvas.waitFor({state:'visible',timeout:20000});
              const box=await canvas.boundingBox();
              assert(box && box.width>300 && box.height>250,`${engine}/${profile.name}: canvas inválido`);
              if(profile.touch){
                await page.touchscreen.tap(box.x+box.width*.50,box.y+box.height*.62);
                await page.touchscreen.tap(box.x+box.width*.70,box.y+box.height*.38);
                await page.evaluate(()=>window.__PROVEN_PONG__.setPlayer(48,-18));
              }else{
                await page.mouse.move(box.x+box.width*.72,box.y+box.height*.34,{steps:14});
                await page.evaluate(()=>window.__PROVEN_PONG__.setPlayer(48,-18));
              }
              await page.waitForTimeout(700);
              const s1=await page.evaluate(()=>window.__PROVEN_PONG__.state());
              assert(dist(s0.player,s1.player)>10,`${engine}/${profile.name}: raquete não respondeu ao controle`);
              await page.waitForTimeout(800);
              const s2=await page.evaluate(()=>window.__PROVEN_PONG__.state());
              assert(dist(s1.ball,s2.ball)>1,`${engine}/${profile.name}: bola congelada`);

              const identity=await page.locator('#identityHud').boundingBox();
              const help=await page.locator('#controlHelp').boundingBox();
              assert(identity && help,`${engine}/${profile.name}: orientação do jogador ausente`);
              assert(identity.y>=0 && identity.y+identity.height<=profile.viewport.height+1,`${engine}/${profile.name}: identidade fora da tela`);
              assert(help.y>=0 && help.y+help.height<=profile.viewport.height+1,`${engine}/${profile.name}: ajuda fora da tela`);
              assert(errors.length===0,`${engine}/${profile.name}: erros ${errors.join(' | ')}`);
              assert(failed.length===0,`${engine}/${profile.name}: requests falharam ${failed.join(' | ')}`);

              const screenshot=`evidence/${engine}-${profile.name}-gameplay.png`;
              await page.screenshot({path:screenshot,fullPage:true});
              results.push({engine,profile:profile.name,viewport:profile.viewport,touch:profile.touch,passed:true,state:s2,screenshot});
            } finally { await context.close(); await browser.close(); }
          }

          (async()=>{
            const desktop={name:'desktop',viewport:{width:1280,height:800},touch:false};
            const ipad={name:'ipad-landscape',viewport:{width:1180,height:820},touch:true,userAgent:'Mozilla/5.0 (iPad; CPU OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'};
            const phone={name:'phone-landscape',viewport:{width:844,height:390},touch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'};
            await runCase(chromium,'chrome',desktop,{executablePath:process.env.SYSTEM_CHROME,args:['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader']});
            await runCase(webkit,'webkit',ipad);
            await runCase(webkit,'webkit',phone);
            fs.writeFileSync('evidence/results.json',JSON.stringify(results,null,2));
            console.log(JSON.stringify(results,null,2));
          })().catch(e=>{fs.writeFileSync('evidence/results.json',JSON.stringify({results,failure:String(e.stack||e)},null,2));console.error(e.stack||e);process.exit(1)});
          NODE
          node /tmp/proven-audit.cjs

      - name: Publish only after browsers pass
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_URL="$(curl --retry 5 --retry-delay 3 --retry-all-errors -fsS -X POST 'https://ship.page/deploy?ttl=604800' -H 'Content-Type: text/html' -H 'User-Agent: Proven-Pong-auditor/1.0' --data-binary @index.html | tr -d '\r\n')"
          echo "$PREVIEW_URL" | grep -Eq '^https://[a-z0-9-]+\.shipped\.page/$'
          printf '%s\n' "$PREVIEW_URL" > PROVEN_PREVIEW_URL.txt
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Verify live route starts and moves
        shell: bash
        env:
          SYSTEM_CHROME: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsSL "$PREVIEW_URL" -o /tmp/live.html
          grep -q 'proven-base-r1' /tmp/live.html
          cat > /tmp/live-check.cjs <<'NODE'
          const { chromium }=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true,executablePath:process.env.SYSTEM_CHROME,args:['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader']});const p=await b.newPage({viewport:{width:1180,height:820}});await p.goto(process.env.PREVIEW_URL,{waitUntil:'domcontentloaded',timeout:60000});await p.locator('#startButton').click();await p.waitForFunction(()=>window.__PROVEN_PONG__,null,{timeout:30000});const a=await p.evaluate(()=>window.__PROVEN_PONG__.state().ball);await p.waitForTimeout(800);const c=await p.evaluate(()=>window.__PROVEN_PONG__.state().ball);if(Math.hypot(c.x-a.x,c.y-a.y,c.z-a.z)<1)throw new Error('live ball frozen');await p.screenshot({path:'evidence/live-ipad.png',fullPage:true});await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/live-check.cjs

      - name: Save verified checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cat > PROVEN_BASE_CHECKPOINT.md <<EOF
          # Proven base checkpoint R1

          - Upstream: erichlof/PathTracedPong
          - Pinned commit: 6ba8949d289f6045d115e0e2e9eeabe7927b14ee
          - License: CC0 1.0, preserved locally
          - Verified preview: $PREVIEW_URL
          - Browser gates: Chrome desktop, WebKit iPad landscape, WebKit phone landscape
          - Scope of this checkpoint: replace the discarded custom neon renderer with a functioning open-source game base and prove player/ball/control legibility before adding mechanics.
          EOF
          git config user.name "Pong Proven-Base Auditor"
          git config user.email "actions@users.noreply.github.com"
          git add PROVEN_PREVIEW_URL.txt PROVEN_BASE_CHECKPOINT.md evidence/results.json
          git commit -m "checkpoint: store browser-verified proven Pong base [skip ci]"
          git push origin HEAD:pong-proven-base-r1

      - name: Upload all evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proven-pong-r1-evidence
          path: |
            evidence
            /tmp/proven-pong-server.log
            PROVEN_PREVIEW_URL.txt
            PROVEN_BASE_CHECKPOINT.md
          if-no-files-found: ignore

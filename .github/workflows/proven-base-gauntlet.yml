name: Proven Pong rebuild gauntlet

on:
  push:
    branches:
      - pong-proven-base-r1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 24

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
        with:
          ref: pong-proven-base-r1
          fetch-depth: 0

      - name: Import pinned CC0 game instead of rebuilding Pong from zero
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_SHA="6ba8949d289f6045d115e0e2e9eeabe7927b14ee"
          if [[ ! -f UPSTREAM_IMPORT_SHA.txt ]]; then
            rm -rf /tmp/PathTracedPong
            git clone --quiet https://github.com/erichlof/PathTracedPong.git /tmp/PathTracedPong
            git -C /tmp/PathTracedPong checkout --quiet "$UPSTREAM_SHA"
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
            rsync -a --exclude='.git' /tmp/PathTracedPong/ ./
            mv Path_Traced_Pong.html index.html
            cp LICENSE LICENSE-UPSTREAM-PathTracedPong
            printf '%s\n' "$UPSTREAM_SHA" > UPSTREAM_IMPORT_SHA.txt
            python3 .github/scripts/proven_import.py

            git config user.name "Pong Proven-Base Auditor"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "rebuild: replace custom neon game with pinned CC0 Pong base [skip ci]"
            git push origin HEAD:pong-proven-base-r1
          fi

          GAME_COMMIT="$(git rev-parse HEAD)"
          PUBLIC_URL="https://cdn.jsdelivr.net/gh/RafaelBritoChoco/Jogo-trompt-@$GAME_COMMIT/index.html"
          echo "GAME_COMMIT=$GAME_COMMIT" >> "$GITHUB_ENV"
          echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"

      - name: Verify source integrity and attribution
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f js/Path_Traced_Pong.js
          test -f js/MobileJoystickControls.js
          test -f shaders/Path_Traced_Pong_Fragment.glsl
          test -f LICENSE-UPSTREAM-PathTracedPong
          grep -q 'proven-base-r2' index.html
          grep -q '__PROVEN_PONG__' js/Path_Traced_Pong.js
          grep -q '__updateObjectMarkers' js/Path_Traced_Pong.js
          grep -q 'vec3(0.08, 0.32, 0.62), COAT' shaders/Path_Traced_Pong_Fragment.glsl
          grep -q 'vec3(0.68, 0.16, 0.07), COAT' shaders/Path_Traced_Pong_Fragment.glsl
          grep -q 'CC0' ATTRIBUTION.md
          test "$(wc -c < js/PathTracingCommon.js)" -gt 100000
          test "$(wc -c < js/three.module.min.js)" -gt 300000
          node --check js/Path_Traced_Pong.js
          python3 -m py_compile .github/scripts/proven_import.py
          node --check .github/scripts/proven_audit.cjs

      - name: Install Chrome and WebKit interaction harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps webkit

      - name: Run real mouse and touch gameplay locally
        shell: bash
        env:
          SYSTEM_CHROME: /usr/bin/google-chrome
          GAME_URL: http://127.0.0.1:8765/index.html
          RESULTS_PATH: evidence/local-results.json
          SHOT_PREFIX: evidence/local
        run: |
          set -euo pipefail
          mkdir -p evidence/local
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/proven-pong-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          node .github/scripts/proven_audit.cjs

      - name: Verify the complete public multi-file route
        shell: bash
        env:
          SYSTEM_CHROME: /usr/bin/google-chrome
          RESULTS_PATH: evidence/public-results.json
          SHOT_PREFIX: evidence/public
        run: |
          set -euo pipefail
          mkdir -p evidence/public
          sleep 10
          curl --retry 7 --retry-delay 3 --retry-all-errors -fsSL "$PUBLIC_URL" -o /tmp/public-index.html
          curl --retry 7 --retry-delay 3 --retry-all-errors -fsSL "https://cdn.jsdelivr.net/gh/RafaelBritoChoco/Jogo-trompt-@$GAME_COMMIT/shaders/Path_Traced_Pong_Fragment.glsl" -o /tmp/public-shader.glsl
          grep -q 'proven-base-r2' /tmp/public-index.html
          grep -q 'vec3(0.08, 0.32, 0.62), COAT' /tmp/public-shader.glsl
          GAME_URL="$PUBLIC_URL" node .github/scripts/proven_audit.cjs
          printf '%s\n' "$PUBLIC_URL" > PROVEN_PREVIEW_URL.txt

      - name: Persist the browser-verified baseline checkpoint
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Proven Pong checkpoint R2'
            echo
            echo '- Canonical branch: pong-proven-base-r1'
            echo '- Upstream: erichlof/PathTracedPong'
            echo '- Upstream commit: 6ba8949d289f6045d115e0e2e9eeabe7927b14ee'
            echo '- License: CC0 1.0, preserved locally'
            echo "- Public preview: $PUBLIC_URL"
            echo '- Browser gates: Chrome desktop, WebKit iPad landscape, WebKit phone landscape'
            echo '- Real controls: mouse drag and touch pointer drag must move the player paddle'
            echo '- Readability: projected player, ball and rival labels must remain visible'
            echo '- Status: baseline checkpoint only; not final approval'
          } > PROVEN_BASE_CHECKPOINT.md

          git config user.name "Pong Proven-Base Auditor"
          git config user.email "actions@users.noreply.github.com"
          git add PROVEN_PREVIEW_URL.txt PROVEN_BASE_CHECKPOINT.md evidence/local-results.json evidence/public-results.json
          git commit -m "checkpoint: store browser-verified proven Pong baseline [skip ci]"
          git push origin HEAD:pong-proven-base-r1

      - name: Upload evidence even when a gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proven-pong-r2-evidence
          path: |
            evidence
            /tmp/proven-pong-server.log
            PROVEN_PREVIEW_URL.txt
            PROVEN_BASE_CHECKPOINT.md
          if-no-files-found: ignore

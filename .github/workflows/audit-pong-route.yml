name: Audit Pong public route

on:
  push:
    branches:
      - pong-3d-ipad-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-route-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      GAME_URL: https://rawcdn.githack.com/RafaelBritoChoco/Jogo-trompt-/3262d519a9bd7f95d77dbfd32bf30728863ec6c4/index.html
    steps:
      - name: Wait for CDN propagation
        run: sleep 20

      - name: Fetch and verify immutable public HTML route
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 5 --retry-all-errors -fsSL -D headers.txt "$GAME_URL" -o game.html
          tr -d '\r' < headers.txt > normalized-headers.txt
          grep -qi '^content-type: text/html' normalized-headers.txt
          grep -q 'NEON PONG 3D' game.html
          grep -q 'window.__PONG__' game.html
          grep -q 'id="pauseb"' game.html
          grep -q '@media(max-width:430px)' game.html
          test "$(wc -c < game.html)" -gt 12000
          echo "Public route verified: $(wc -c < game.html) bytes"

      - name: Execute downloaded bytes in external Chrome
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/pong-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --window-size=390,844 \
            --virtual-time-budget=5000 \
            --dump-dom http://127.0.0.1:8765/game.html > local-rendered-dom.html
          grep -q 'data-test="pass"' local-rendered-dom.html
          grep -q 'TESTES: 5/5 OK' local-rendered-dom.html
          grep -q 'id="pauseb">Pausar' local-rendered-dom.html
          ! grep -q 'Canvas indisponível' local-rendered-dom.html
          echo "Downloaded runtime verified"

      - name: Navigate and execute the public route directly
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --window-size=820,1180 \
            --virtual-time-budget=5000 \
            --dump-dom "$GAME_URL" > remote-rendered-dom.html
          grep -q 'data-test="pass"' remote-rendered-dom.html
          grep -q 'TESTES: 5/5 OK' remote-rendered-dom.html
          grep -q 'id="pauseb">Pausar' remote-rendered-dom.html
          ! grep -q 'Canvas indisponível' remote-rendered-dom.html
          echo "Direct public runtime verified"

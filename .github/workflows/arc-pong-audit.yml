name: ARC Pong browser gauntlet

on:
  push:
    branches:
      - arc-pong-arena-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-gauntlet:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out arena branch
        uses: actions/checkout@v4
        with:
          ref: arc-pong-arena-v2
          fetch-depth: 0

      - name: Replace absolute frame threshold with relative liveness proof
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/arc-pong-audit.cjs')
          text = path.read_text()

          start_anchor = """    await waitState(
              page,
              () => window.__ARC_PONG_DIAGNOSTICS__?.state === 'play',
              `${engine}: match did not enter play`,
            );

            const beforeBall"""
          start_replacement = """    await waitState(
              page,
              () => window.__ARC_PONG_DIAGNOSTICS__?.state === 'play',
              `${engine}: match did not enter play`,
            );

            const livenessStart = await page.evaluate(() => ({
              frame: window.__ARC_PONG_DIAGNOSTICS__.frame,
              simTime: window.__ARC_PONG_DIAGNOSTICS__.simTime,
            }));

            const beforeBall"""

          end_anchor = """    const diagnostics = await page.evaluate(() => window.__ARC_PONG_DIAGNOSTICS__);
            assert(diagnostics.frame > 120, `${engine}: too few frames advanced`);
            assert("""
          end_replacement = """    const diagnostics = await page.evaluate(() => window.__ARC_PONG_DIAGNOSTICS__);
            assert(
              diagnostics.frame - livenessStart.frame > 20,
              `${engine}: render loop stalled`,
            );
            assert(
              diagnostics.simTime - livenessStart.simTime > 0.8,
              `${engine}: simulation clock stalled`,
            );
            assert("""

          if start_anchor not in text:
              raise SystemExit('Start liveness anchor not found')
          if end_anchor not in text:
              raise SystemExit('End liveness anchor not found')

          text = text.replace(start_anchor, start_replacement, 1)
          text = text.replace(end_anchor, end_replacement, 1)
          path.write_text(text)
          PY

          git config user.name 'ARC Pong Gauntlet Auditor'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/arc-pong-audit.cjs
          git commit -m 'test: verify render and simulation liveness relatively [skip ci]'
          git push origin HEAD:arc-pong-arena-v2

      - name: Static contract checks
        run: |
          set -euo pipefail
          grep -q 'ARC PONG — Neon Ricochet' index.html
          grep -q '__ARC_PONG_DIAGNOSTICS__' index.html
          grep -q 'three@0.185.1' index.html
          grep -q 'RIFT GATE' index.html
          grep -q 'perfectWindow:.12' index.html
          grep -q 'id="pauseTop"' index.html
          grep -q 'parryAtRealImpact' tests/arc-pong-audit.cjs
          grep -q 'simulation clock stalled' tests/arc-pong-audit.cjs
          test "$(wc -c < index.html)" -gt 50000
          node --check tests/arc-pong-audit.cjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          modules = re.findall(r'<script type="module">\s*(.*?)\s*</script>', html, re.S)
          assert len(modules) == 1
          Path('/tmp/arc-pong.mjs').write_text(modules[0])
          PY
          node --check /tmp/arc-pong.mjs

      - name: Install browser harness
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit

      - name: Run Chrome and WebKit gameplay tests
        env:
          SYSTEM_CHROME: /usr/bin/google-chrome
        run: node tests/arc-pong-audit.cjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-pong-browser-evidence
          path: |
            evidence
            /tmp/server.log
          if-no-files-found: ignore

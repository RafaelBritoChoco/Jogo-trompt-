name: ARC Pong browser gauntlet

on:
  push:
    branches:
      - arc-pong-arena-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-gauntlet:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out arena branch
        uses: actions/checkout@v4
        with:
          ref: arc-pong-arena-v2
          fetch-depth: 0

      - name: Validate and apply versioned fixes
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply-arc-fixes.py
          python3 scripts/apply-arc-fixes.py

          if ! git diff --quiet -- index.html tests/arc-pong-audit.cjs; then
            git config user.name "ARC Pong Gauntlet Auditor"
            git config user.email "actions@users.noreply.github.com"
            git add index.html tests/arc-pong-audit.cjs
            git commit -m "fix: isolate abilities and clear player sightline [skip ci]"
            git push origin HEAD:arc-pong-arena-v2
          fi

      - name: Static contract checks
        run: |
          set -euo pipefail
          grep -q "ARC PONG — Neon Ricochet" index.html
          grep -q "__ARC_PONG_DIAGNOSTICS__" index.html
          grep -q "three@0.185.1" index.html
          grep -q "RIFT GATE" index.html
          grep -q "perfectWindow:.12" index.html
          grep -q "id=\"pauseTop\"" index.html
          grep -q "rel=\"icon\" href=\"data:,\"" index.html
          grep -q "visualMode:isPlayer?'hologram-outline':'solid'" index.html
          grep -q "new THREE.TorusGeometry(w.radius\*.82" index.html
          grep -q "dashEnergyBefore" tests/arc-pong-audit.cjs
          grep -q "playerVisuals = await page.evaluate" tests/arc-pong-audit.cjs
          grep -q "parryAtRealImpact" tests/arc-pong-audit.cjs
          grep -q "simulation clock stalled" tests/arc-pong-audit.cjs
          test "$(wc -c < index.html)" -gt 50000
          node --check tests/arc-pong-audit.cjs

          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          modules = re.findall(r'<script type="module">\s*(.*?)\s*</script>', html, re.S)
          assert len(modules) == 1
          Path("/tmp/arc-pong.mjs").write_text(modules[0], encoding="utf-8")
          PY

          node --check /tmp/arc-pong.mjs

      - name: Install browser harness
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit

      - name: Run Chrome and WebKit gameplay tests
        env:
          SYSTEM_CHROME: /usr/bin/google-chrome
        run: node tests/arc-pong-audit.cjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-pong-browser-evidence
          path: |
            evidence
            /tmp/server.log
          if-no-files-found: ignore

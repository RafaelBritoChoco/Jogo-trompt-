name: ARC Pong browser gauntlet

on:
  push:
    branches:
      - arc-pong-arena-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-gauntlet:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out arena branch
        uses: actions/checkout@v4
        with:
          ref: arc-pong-arena-v2
          fetch-depth: 0

      - name: Validate and apply versioned fixes
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply-arc-fixes.py
          python3 scripts/apply-arc-fixes.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/arc-pong-audit.cjs")
          text = path.read_text(encoding="utf-8")

          dash_old = """    await waitState(
              page,
              () => window.__ARC_PONG_DIAGNOSTICS__?.state === 'play',
              `${engine}: dash scenario did not enter play`,
            );
            const dashEnergyBefore"""
          dash_new = """    await waitState(
              page,
              () => {
                const diagnostics = window.__ARC_PONG_DIAGNOSTICS__;
                return diagnostics?.state === 'play' && diagnostics.player.energy >= 99;
              },
              `${engine}: dash scenario did not publish restored energy`,
            );
            const dashEnergyBefore"""

          shield_old = """    await waitState(
              page,
              () => window.__ARC_PONG_DIAGNOSTICS__?.state === 'play',
              `${engine}: shield scenario did not enter play`,
            );
            await activate(page, touch, '#shieldBtn', 'KeyE');"""
          shield_new = """    await waitState(
              page,
              () => {
                const diagnostics = window.__ARC_PONG_DIAGNOSTICS__;
                return diagnostics?.state === 'play' && diagnostics.player.energy >= 99;
              },
              `${engine}: shield scenario did not publish restored energy`,
            );
            await activate(page, touch, '#shieldBtn', 'KeyE');"""

          delta_old = "`${engine}: dash energy delta was too small`,"
          delta_new = "`${engine}: dash energy delta was too small (${dashEnergyBefore} -> ${dashEnergyAfter})`,"

          if "dash scenario did not publish restored energy" not in text:
              if dash_old not in text:
                  raise SystemExit("Dash synchronization target not found")
              text = text.replace(dash_old, dash_new, 1)

          if "shield scenario did not publish restored energy" not in text:
              if shield_old not in text:
                  raise SystemExit("Shield synchronization target not found")
              text = text.replace(shield_old, shield_new, 1)

          if "dash energy delta was too small (${dashEnergyBefore}" not in text:
              if delta_old not in text:
                  raise SystemExit("Dash diagnostic message target not found")
              text = text.replace(delta_old, delta_new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          if ! git diff --quiet -- index.html tests/arc-pong-audit.cjs; then
            git config user.name "ARC Pong Gauntlet Auditor"
            git config user.email "actions@users.noreply.github.com"
            git add index.html tests/arc-pong-audit.cjs
            git commit -m "test: synchronize ability energy snapshots [skip ci]"
            git push origin HEAD:arc-pong-arena-v2
          fi

      - name: Static contract checks
        run: |
          set -euo pipefail
          grep -q "ARC PONG — Neon Ricochet" index.html
          grep -q "__ARC_PONG_DIAGNOSTICS__" index.html
          grep -q "three@0.185.1" index.html
          grep -q "RIFT GATE" index.html
          grep -q "perfectWindow:.12" index.html
          grep -q "id=\"pauseTop\"" index.html
          grep -q "rel=\"icon\" href=\"data:,\"" index.html
          grep -q "visualMode:isPlayer?'hologram-outline':'solid'" index.html
          grep -q "new THREE.TorusGeometry(w.radius\*.82" index.html
          grep -q "dashEnergyBefore" tests/arc-pong-audit.cjs
          grep -q "dash scenario did not publish restored energy" tests/arc-pong-audit.cjs
          grep -q "playerVisuals = await page.evaluate" tests/arc-pong-audit.cjs
          grep -q "parryAtRealImpact" tests/arc-pong-audit.cjs
          grep -q "simulation clock stalled" tests/arc-pong-audit.cjs
          test "$(wc -c < index.html)" -gt 50000
          node --check tests/arc-pong-audit.cjs

          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          modules = re.findall(r'<script type="module">\s*(.*?)\s*</script>', html, re.S)
          assert len(modules) == 1
          Path("/tmp/arc-pong.mjs").write_text(modules[0], encoding="utf-8")
          PY

          node --check /tmp/arc-pong.mjs

      - name: Install browser harness
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit

      - name: Run Chrome and WebKit gameplay tests
        env:
          SYSTEM_CHROME: /usr/bin/google-chrome
        run: node tests/arc-pong-audit.cjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-pong-browser-evidence
          path: |
            evidence
            /tmp/server.log
          if-no-files-found: ignore

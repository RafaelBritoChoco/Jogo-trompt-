name: Assemble Court Pong repository rebuild

on:
  push:
    branches:
      - pong-curvebreak-rebuild
    paths:
      - .github/workflows/assemble-court-pong.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out canonical R4
        uses: actions/checkout@v4
        with:
          ref: pong-curvebreak-rebuild
          fetch-depth: 0

      - name: Apply R5 mobile control calibration
        shell: bash
        run: |
          set -euo pipefail
          echo '0c93585c69b82ee1114ae3c4248dd7714c8eacc9ffe6d918aceac13054c307b2  index.html' | sha256sum -c -
          echo '110573810889ea2ccfab6ffae059af0a82b798d29c3146ea3f303e6b1eabb38f  tests/court-pong-audit.cjs' | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          assert 'data-build="court-pong-repo-r4"' in html
          html = html.replace('data-build="court-pong-repo-r4"', 'data-build="court-pong-repo-r5"', 1)

          before = """        this.playerMarker = document.getElementById('player-marker');\n        this.testBadge = document.getElementById('testBadge');\n        this.startBtn.addEventListener('click', () => this.primaryAction());\n"""
          after = """        this.playerMarker = document.getElementById('player-marker');\n        this.testBadge = document.getElementById('testBadge');\n        if (this.isCoarse) {\n          this.parryBtn.querySelector('small').textContent = 'SEGURE';\n          this.dashBtn.querySelector('small').textContent = `${CONFIG.dashCost} ENERGIA`;\n          this.shieldBtn.querySelector('small').textContent = `${CONFIG.shieldCost} ENERGIA`;\n          this.weaponBtn.querySelector('small').textContent = 'TOQUE';\n        }\n        this.startBtn.addEventListener('click', () => this.primaryAction());\n"""
          assert before in html
          html = html.replace(before, after, 1)

          before = """        const baseY = phonePortrait ? 12 : portrait ? 9 : 5;\n        const baseZ = phonePortrait ? 28 : portrait ? 22.5 : 17.5;\n        const targetZ = phonePortrait ? 6 : portrait ? 4.5 : 1.5;\n"""
          after = """        const baseY = phonePortrait ? 10.8 : portrait ? 9 : 5;\n        const baseZ = phonePortrait ? 25.5 : portrait ? 22.5 : 17.5;\n        const targetZ = phonePortrait ? 6.2 : portrait ? 4.5 : 1.5;\n"""
          assert before in html
          html = html.replace(before, after, 1)

          before = """        this.renderer.setSize(w, h, false);\n        this.renderProbe = 0;\n      }\n"""
          after = """        this.renderer.setSize(w, h, false);\n        this.renderProbe = 0;\n        if (this.frame > 0) {\n          this.bootReady = false;\n          window.__COURT_PONG_BOOTED__ = false;\n          document.documentElement.dataset.test = 'pending';\n        }\n      }\n"""
          assert before in html
          html = html.replace(before, after, 1)

          before = """        if (!this.bootReady && this.frame >= 2) {\n          if (this.sampleRenderedScene() >= 2) {\n            this.bootReady = true;\n            window.__COURT_PONG_BOOTED__ = true;\n            document.documentElement.dataset.test = 'pass';\n          }\n        } else if (this.bootReady && this.frame % 240 === 0) {\n          this.sampleRenderedScene();\n        }\n"""
          after = """        if (!this.bootReady && this.frame >= 2) {\n          if (this.sampleRenderedScene() >= 2) {\n            this.bootReady = true;\n            window.__COURT_PONG_BOOTED__ = true;\n            document.documentElement.dataset.test = 'pass';\n          }\n        }\n"""
          assert before in html
          index_path.write_text(html.replace(before, after, 1), encoding='utf-8')

          test_path = Path('tests/court-pong-audit.cjs')
          test_text = test_path.read_text(encoding='utf-8')

          before = """    userAgent: touch\n      ? 'Mozilla/5.0 (iPad; CPU OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'\n      : undefined,\n"""
          after = """    userAgent: touch\n      ? (viewport.width <= 844 && viewport.height <= 844\n        ? 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'\n        : 'Mozilla/5.0 (iPad; CPU OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1')\n      : undefined,\n"""
          assert before in test_text
          test_text = test_text.replace(before, after, 1)

          before = """    assert(!(await page.locator('#fatal').isVisible()), `${id}: fatal screen visible`);\n    assert(await page.locator('#startBtn').isVisible(), `${id}: start button missing`);\n\n    const initial = await diagnostics(page);\n"""
          after = """    assert(!(await page.locator('#fatal').isVisible()), `${id}: fatal screen visible`);\n    assert(await page.locator('#startBtn').isVisible(), `${id}: start button missing`);\n    assert(!(await page.locator('#pauseBtn').isVisible()), `${id}: pause button should be hidden before the duel`);\n    if (touch) {\n      const hints = await page.locator('#actions small').allTextContents();\n      assert(hints.join('|') === 'SEGURE|26 ENERGIA|42 ENERGIA|TOQUE', `${id}: mobile hints are not touch-specific: ${hints.join('|')}`);\n    }\n\n    const initial = await diagnostics(page);\n"""
          assert before in test_text
          test_text = test_text.replace(before, after, 1)

          before = """      await runCase(wk, 'webkit-ipad-landscape', { viewport: { width: 1180, height: 820 }, touch: true });\n      await runCase(wk, 'webkit-ipad', { viewport: { width: 820, height: 1180 }, touch: true });\n      await runCase(wk, 'webkit-phone', { viewport: { width: 390, height: 844 }, touch: true });\n"""
          after = """      await runCase(wk, 'webkit-ipad-landscape', { viewport: { width: 1180, height: 820 }, touch: true });\n      await runCase(wk, 'webkit-ipad', { viewport: { width: 820, height: 1180 }, touch: true });\n      await runCase(wk, 'webkit-phone', { viewport: { width: 390, height: 844 }, touch: true });\n      await runCase(wk, 'webkit-phone-landscape', { viewport: { width: 844, height: 390 }, touch: true });\n"""
          assert before in test_text
          test_path.write_text(test_text.replace(before, after, 1), encoding='utf-8')
          PY

          grep -q 'data-build="court-pong-repo-r5"' index.html
          grep -q "textContent = 'SEGURE'" index.html
          grep -q 'webkit-phone-landscape' tests/court-pong-audit.cjs
          node --check tests/court-pong-audit.cjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          modules = re.findall(r'<script type="module">\s*(.*?)\s*</script>', html, re.S)
          assert len(modules) == 1
          Path('/tmp/court-pong-r5.mjs').write_text(modules[0], encoding='utf-8')
          PY
          node --check /tmp/court-pong-r5.mjs
          sha256sum index.html tests/court-pong-audit.cjs

      - name: Commit R5 mobile calibration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Court Pong Repository Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html tests/court-pong-audit.cjs
          if git diff --cached --quiet; then
            echo 'R5 already matches the branch.'
          else
            git commit -m 'fix: calibrate touch labels and portrait framing'
            git push origin HEAD:pong-curvebreak-rebuild
          fi
